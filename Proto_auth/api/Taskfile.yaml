version: "3"

tasks:
  generate:
    aliases:
      - gen
    desc: "Для быстрой генерации proto файлов"
    deps:
      - task: ustanovit_plaginy
    cmds:
      - protoc -I proto proto/auth/auth.proto --go_out=gen/go --go_opt=paths=source_relative --go-grpc_out=gen/go --go-grpc_opt=paths=source_relative

  ustanovit_plaginy:
    desc: "Установка protoc плагинов если их нет"
    status:
      - command -v protoc-gen-go
      - command -v protoc-gen-go-grpc
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest